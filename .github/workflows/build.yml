name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # Universal, so one download covers Apple Silicon and Intel.
            extra_cmake: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
          - name: Windows
            os: windows-latest
            extra_cmake: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # JUCE needs ALSA and X11 headers on Linux only; macOS and Windows
      # runners already have everything.

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "${{ matrix.extra_cmake }}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage artefacts
        shell: bash
        run: |
          mkdir -p out
          cp -R build/FrostyEQ_artefacts/Release/VST3/FrostyEQ.vst3 out/
          if [ -d build/FrostyEQ_artefacts/Release/AU/FrostyEQ.component ]; then
            cp -R build/FrostyEQ_artefacts/Release/AU/FrostyEQ.component out/
          fi
          cp LICENSE out/LICENSE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FrostyEQ-${{ matrix.name }}
          path: out/
